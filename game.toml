]
known_sha1 = [
  "b6b93c7d3377f9d6415f4544d359e86d43613922",
]
known_crc32 = [
  "b63b5ce0",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Micro Maniacs Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

# Only read while the mmr.widescreen mod selects a wider aspect; 4:3 is stock.
[widescreen]
gte_game_mode = true

# Floor/track renderers (0x8001b6xx..0x8001eexx) reject a primitive when the
# AND of its SXY words hits mask 0xF3008600 (all X < 0 or all X >= 512, or
# all Y off screen). These mfc2 reads feed only that fold; while widened, an X
# in the revealed band reads as the screen edge, so the band gets its polygons.
[widescreen.cull]
clip_edge_width = 512
sxy_read_sites = [
